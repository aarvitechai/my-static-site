name: CI

# Runs on every PR into an environment branch and on every push to dev.
# Make these jobs "required status checks" in branch protection so nothing merges red.
on:
  pull_request:
    branches: [dev, staging, production]
  push:
    branches: [dev]
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26; upgrade deliberately
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # NuGetAudit (Directory.Build.props) fails restore on any known-vulnerable package.
      - name: Restore
        run: dotnet restore RedStarVibe.slnx

      # TreatWarningsAsErrors + analyzers make this the code-quality gate.
      - name: Build
        run: dotnet build RedStarVibe.slnx --configuration Release --no-restore

      # Tests are added in Phase 1, slice 5; this step starts doing work then.
      - name: Test
        run: dotnet test RedStarVibe.slnx --configuration Release --no-build

  web:
    name: Web (React)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26; upgrade deliberately
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (exact versions from lock file)
        run: npm ci

      # Gate on vulnerabilities in code shipped to users; dev-only tooling is tracked by Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
