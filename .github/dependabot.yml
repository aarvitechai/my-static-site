# Weekly dependency update PRs, opened against dev (they reach staging/production by promotion); security updates are raised immediately by GitHub regardless of schedule.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }

  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
